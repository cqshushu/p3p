name: Android Build

on:
  push:
    branches: [ "main", "master", "dev", "release" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android SDK Platform 36
      run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleMobileArmeabi_v7aDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mobile-armeabi_v7a-debug
        path: app/build/outputs/apk/mobile/armeabi_v7a/debug/*.apk
